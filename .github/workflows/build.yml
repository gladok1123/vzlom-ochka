name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Ошибки компиляции выводятся аннотациями ::error:: — чтобы их было
      # видно прямо в интерфейсе Actions, без вычитки полного лога.
      - name: Fetch C++/WinRT package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/cppwinrt-pkg | Out-Null
          try {
            Invoke-WebRequest -UseBasicParsing -OutFile cppwinrt.nupkg `
              -Uri "https://www.nuget.org/api/v2/package/Microsoft.Windows.CppWinRT/2.0.240111.5"
            Expand-Archive -Path cppwinrt.nupkg -DestinationPath build/cppwinrt-pkg -Force
          } catch {
            Write-Host "::warning::C++/WinRT не скачался, сборка пойдёт на SDK-заголовках"
          }

      - name: Configure (CMake, x64)
        shell: pwsh
        run: |
          # Генератор не задаём жёстко: пусть CMake возьмёт установленную
          # Visual Studio (2022 или новее) — иначе сборка падает на раннерах,
          # где версия другая.
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release 2>&1 |
            Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content configure.log -Tail 40 | ForEach-Object { Write-Host "::error::$($_)" }
            exit 1
          }

      - name: Which C++/WinRT headers
        shell: pwsh
        run: |
          if (Test-Path build/cppwinrt-generated/winrt/base.h) {
            $files = Get-ChildItem build/cppwinrt-generated/winrt -Filter *.h
            $names = ($files | Select-Object -First 12 -ExpandProperty Name) -join ", "
            Write-Host "::notice::C++/WinRT: сгенерировано $($files.Count) заголовков: $names"
          } else {
            Write-Host "::notice::C++/WinRT: заголовки из Windows SDK (генерация не удалась)"
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log | Select-String -Pattern "error C|error LNK|error MSB|fatal error" |
              Select-Object -First 30 | ForEach-Object { Write-Host "::error::$($_.Line)" }
            exit 1
          }

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: YandexMusicPlayer-x64
          path: build/Release/YandexMusicPlayer.exe
          if-no-files-found: error
