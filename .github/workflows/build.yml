name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    # windows-2022 = Visual Studio 2022 (MSVC 14.4x). Образ windows-latest
    # сейчас несёт VS 2026, чей компилятор уже не принимает заголовки
    # C++/WinRT из Windows SDK, — поэтому версия образа зафиксирована.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Ошибки компиляции выводятся аннотациями ::error:: — чтобы их было
      # видно прямо в интерфейсе Actions, без вычитки полного лога.
      - name: Configure (CMake, x64)
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release 2>&1 |
            Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content configure.log -Tail 40 | ForEach-Object { Write-Host "::error::$($_)" }
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log | Select-String -Pattern "error C|error LNK|error MSB|fatal error" |
              Select-Object -First 30 | ForEach-Object { Write-Host "::error::$($_.Line)" }
            exit 1
          }

      # Предупреждения /W4 полезно видеть, но они не должны ронять сборку.
      - name: Show warnings
        shell: pwsh
        run: |
          $warn = Get-Content build.log | Select-String -Pattern ": warning C"
          Write-Host "::notice::Предупреждений компилятора: $($warn.Count)"
          $warn | Select-Object -First 25 | ForEach-Object { Write-Host "::warning::$($_.Line)" }

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: YandexMusicPlayer-x64
          path: build/Release/YandexMusicPlayer.exe
          if-no-files-found: error

  # Тег v1.0.0 → отдельная сборка публикует exe в Releases.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YandexMusicPlayer-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/YandexMusicPlayer.exe
          generate_release_notes: true
